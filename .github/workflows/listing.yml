name: Listing

# Uploads the listing to the app's version in App Store Connect: the text in AppStore/Listing.md (name, subtitle,
# description, keywords, promotional text, URLs, categories, copyright) and the captioned screenshots in
# AppStore/screenshots/{iphone,ipad} (6.9" iPhone and 13" iPad slots; fastlane tells them apart by size), replacing
# what is there. Uses the same ASC_* secrets as TestFlight. No build, and it never submits for review.
on:
  workflow_dispatch:
  push:
    branches: ['appstore-*']
    paths: ['AppStore/**', '.github/workflows/listing.yml']

concurrency: listing

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install fastlane
        run: sudo gem install fastlane -N

      - name: Upload listing
        env:
          KID: ${{ secrets.ASC_KEY_ID }}
          IID: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          LC_ALL: en_US.UTF-8
          LANG: en_US.UTF-8
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/asc" "$RUNNER_TEMP/shots/en-US"
          # tolerate a .p8 pasted without its BEGIN/END lines (as GlassHouse's is)
          ruby -rjson -e 'k = ENV["P8"].gsub("\\n", "\n").delete("\r").strip
            unless k.include?("-----BEGIN")
              b = k.gsub(/[^A-Za-z0-9+\/=]/, ""); k = "-----BEGIN PRIVATE KEY-----\n" + b.scan(/.{1,64}/).join("\n") + "\n-----END PRIVATE KEY-----"
            end
            File.write(ARGV[0], JSON.generate({key_id: ENV["KID"].strip, issuer_id: ENV["IID"].strip, key: k, in_house: false}))' "$RUNNER_TEMP/asc/key.json"
          python3 AppStore/metadata.py "$RUNNER_TEMP/metadata"
          for d in iphone ipad; do for f in AppStore/screenshots/$d/*.png; do cp "$f" "$RUNNER_TEMP/shots/en-US/$d-$(basename "$f")"; done; done
          ls -la "$RUNNER_TEMP/shots/en-US"
          VERSION=$(grep -m1 "MARKETING_VERSION" ios/GlassHouse.xcodeproj/project.pbxproj | sed -E 's/.*= ([0-9.]+);/\1/')
          # deliver wants a Deliverfile, or it stops to ask whether to create one
          mkdir -p "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          cat > Deliverfile <<DELIVER
          api_key_path "$RUNNER_TEMP/asc/key.json"
          app_identifier "com.samuelling.glasshouse"
          platform "ios"
          app_version "$VERSION"
          screenshots_path "$RUNNER_TEMP/shots"
          overwrite_screenshots true
          skip_binary_upload true
          metadata_path "$RUNNER_TEMP/metadata"
          skip_metadata false
          skip_app_version_update true
          run_precheck_before_submit false
          submit_for_review false
          force true
          DELIVER
          sed -i 's/^ *//' Deliverfile
          fastlane deliver 2>&1 | tail -60

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
